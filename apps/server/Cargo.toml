[package]
name = "workbench-server"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Headless Workbench control-plane server: projects, worktrees, terminals and Claude/Codex chat sessions for the desktop and mobile apps."

[[bin]]
name = "workbench-server"
path = "src/main.rs"

[dependencies]
workbench-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
portable-pty = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Process-GROUP termination (kill the shell + its descendants) on Unix, so
# closing a terminal doesn't orphan child processes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"
