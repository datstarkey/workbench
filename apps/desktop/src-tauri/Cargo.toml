[package]
name = "workbench"
version = "0.1.0"
description = "Workbench terminal manager"
license = "AGPL-3.0-or-later"
authors = []
edition = "2021"

[lib]
name = "workbench_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
workbench-core = { workspace = true }
workbench-server = { path = "../../server" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
notify = "7"
notify-debouncer-mini = "0.5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
chrono = "0.4"
sentry = { version = "0.48", features = ["log"] }
log = "0.4"
env_logger = "0.11"
# Embedded W3C WebDriver server for the e2e suite (apps/desktop/e2e). Only
# compiled with `--features e2e`; see the guard in lib.rs.
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
# Enables `tauri::test` (mock runtime) for testing #[tauri::command] handlers
# without a webview. Feature unification keeps it out of release builds.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
