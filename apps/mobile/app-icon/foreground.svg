<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The desktop glyph scaled to 0.78 about the centre so every corner stays inside the adaptive-icon safe zone (66dp of 108dp). -->
  <defs>
    <linearGradient id="panel" x1="260" y1="220" x2="760" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="340" y1="380" x2="690" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <g transform="translate(512 512) scale(0.78) translate(-512 -512)">
    <rect x="212" y="240" width="600" height="544" rx="84" fill="url(#panel)"/>
    <rect x="212" y="240" width="600" height="544" rx="84" fill="none" stroke="#67e8f9" stroke-opacity="0.22" stroke-width="12"/>
    <circle cx="756" cy="240" r="58" fill="#67e8f9" opacity="0.7" filter="url(#soft)"/>
    <circle cx="756" cy="240" r="20" fill="#e0f2fe"/>
    <circle cx="304" cy="318" r="13" fill="#fda4af"/>
    <circle cx="350" cy="318" r="13" fill="#fde68a"/>
    <circle cx="396" cy="318" r="13" fill="#86efac"/>
    <path d="M348 475L468 576L348 676" fill="none" stroke="url(#accent)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="530" y="644" width="172" height="54" rx="27" fill="url(#accent)"/>
  </g>
</svg>
