[package]
name = "workbench-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Shared Workbench logic: config, git/worktree, sessions, settings, types"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }
log = "0.4"
getrandom = "0.4"
if-addrs = "0.15"
base64 = "0.22"
chrono = { workspace = true }
portable-pty = { workspace = true }
toml_edit = "0.20"
uuid = { workspace = true }
gix = { version = "0.89", default-features = false, features = ["sha1"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
open = { version = "5.3", features = ["shellexecute-on-windows"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = { workspace = true }
