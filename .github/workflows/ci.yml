name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Decides which suites a change needs. The suite jobs below are required
  # branch-protection checks, so they must never be filtered out at the
  # workflow level (`paths-ignore`): a check that never reports blocks the PR
  # forever. A job skipped by its own `if:` reports as passed instead. If this
  # job fails, every suite runs (fail-safe) rather than skipping.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.frontend.outputs.code }}
      rust: ${{ steps.rust.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      # Anything except docs, design-sync inputs and Rust-only files.
      - uses: dorny/paths-filter@v3
        id: frontend
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.design-sync/**'
              - '!changelog/**'
              - '!docs/**'
              - '!site/**'
              - '!LICENSE'
              - '!**/*.rs'
              - '!**/Cargo.toml'
              - '!Cargo.lock'

      - uses: dorny/paths-filter@v3
        id: rust
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'apps/server/**'
              - 'apps/*/src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Always runs: prettier also checks the markdown a docs-only change touches.
      - name: Check formatting
        run: bun run format --check

      - name: Lint
        if: needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true'
        run: bun run lint

      - name: Typecheck
        if: needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true'
        run: bun run check

      - name: Test
        if: needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true'
        run: bun run test

  rust:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run Rust tests
        run: cargo test
        working-directory: apps/desktop/src-tauri

  rust-windows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Check Rust compiles on Windows
        run: cargo test --no-run
        working-directory: apps/desktop/src-tauri

  # Smoke-tests the built app over WebDriver (apps/desktop/e2e). Not a required
  # check: WebKitGTK under xvfb is new here, so it earns that once it's stable.
  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install dependencies
        run: bun install

      - name: Build the e2e app
        run: bun run --cwd apps/desktop build:e2e

      - name: Run WebDriver smoke tests
        run: xvfb-run --auto-servernum bun run --cwd apps/desktop test:e2e
