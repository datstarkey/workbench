name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry-runs the Android build: the signed APK is kept as a workflow artifact and no
  # release is touched. Desktop jobs and publish only run for tag pushes.
  workflow_dispatch:

jobs:
  changelog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Read changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          FILE="changelog/RELEASE_v${VERSION}.md"
          if [ -f "$FILE" ]; then
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            cat "$FILE" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: github.event_name == 'push'
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            cache-key: release-universal-apple-darwin
          - os: windows-latest
            args: ''
            rust-targets: ''
            cache-key: release-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version from tag (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd apps/desktop/src-tauri
          sed -i '' "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json
          echo "Set tauri.conf.json version to ${VERSION}"

      - name: Sync version from tag (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw
          $conf = $conf -replace '"version": ".*?"', "`"version`": `"$version`""
          Set-Content apps/desktop/src-tauri/tauri.conf.json -Value $conf -NoNewline
          Write-Host "Set tauri.conf.json version to $version"

      # The Tauri CLI reads APPLE_* from the environment and imports the certificate
      # into a throwaway keychain itself, so nothing here touches `security`.
      #
      # This workflow only ever runs on a v* tag, so every run is a release build and
      # a missing credential is a hard failure. v0.27.0 shipped publicly unsigned
      # because this step used to warn and continue: `gh secret set` without a TTY
      # stores an *empty* string, `gh secret list` still showed the secret as present,
      # and the release published green. Fail loudly instead — an aborted release is
      # cheap, a public unsigned build claiming to be signed is not.
      #
      # To ship unsigned deliberately (expired certificate, Apple outage), set repo
      # variable ALLOW_UNSIGNED_RELEASE=true.
      - name: Configure Apple code signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -z "${!v}" ] && missing="$missing $v"
          done

          if [ -n "$missing" ]; then
            if [ "$ALLOW_UNSIGNED" = "true" ]; then
              echo "::warning::empty or unset:$missing — ALLOW_UNSIGNED_RELEASE is set, shipping UNSIGNED"
              exit 0
            fi
            echo "::error::empty or unset:$missing"
            echo "::error::Refusing to publish an unsigned release. See docs/SIGNING.md §4."
            echo "::error::A secret can exist but be empty — 'gh secret set' without a TTY stores ''."
            exit 1
          fi

          {
            echo "APPLE_CERTIFICATE<<__WB_EOF__"
            echo "$APPLE_CERTIFICATE"
            echo "__WB_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: 'Workbench v__VERSION__'
          releaseBody: '${{ needs.changelog.outputs.body }}'
          releaseDraft: true
          prerelease: false
          tauriScript: bunx tauri
          args: ${{ matrix.args }}

      # Tauri notarizes and staples the .app but only *signs* the .dmg, and Gatekeeper
      # assesses the container the user downloads — an unnotarized DMG still warns on
      # open even when the app inside is stapled. Runs after tauri-action, so the
      # stapled DMG has to replace the asset it already uploaded; safe because the
      # release stays a draft until the publish job.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::no DMG found to notarize"
            exit 1
          fi
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber --repo "${{ github.repository }}"

  # Builds in parallel with desktop but never talks to the release: tauri-action creates
  # the draft inside `build`, so uploading from here would race it (and a draft created
  # here first could be duplicated by tauri-action). The APK travels as an artifact and
  # `publish` attaches it once the draft is guaranteed to exist.
  android:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # r28+ links 16 KB page-aligned binaries by default. Same version as the local builds.
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      # 64-bit ARM only: every supported phone is arm64, and each extra ABI adds a full
      # Rust cross-build to the release.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-android-aarch64

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version from tag
        if: github.event_name == 'push'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" apps/mobile/src-tauri/tauri.conf.json
          echo "Set mobile tauri.conf.json version to ${VERSION}"

      # Always a hard failure, dispatch included: an unsigned APK cannot be installed, and
      # one signed with any other key cannot update an existing install, so there is no
      # useful unsigned fallback (ALLOW_UNSIGNED_RELEASE does not apply here). As with the
      # Apple step, `gh secret set` without a TTY stores an empty string that still shows
      # up in `gh secret list`, so check the values, not just their presence.
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::empty or unset:$missing"
            echo "::error::Refusing to build an unsigned APK. See docs/SIGNING.md (Android)."
            echo "::error::A secret can exist but be empty — 'gh secret set' without a TTY stores ''."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/workbench-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          # Backslashes are escapes in .properties files.
          esc() { printf '%s' "${1//\\/\\\\}"; }
          umask 077
          {
            echo "storeFile=$(esc "$KEYSTORE")"
            echo "storePassword=$(esc "$ANDROID_KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$ANDROID_KEY_ALIAS")"
            echo "keyPassword=$(esc "$ANDROID_KEY_PASSWORD")"
          } > apps/mobile/src-tauri/gen/android/keystore.properties

      - name: Build signed APK
        working-directory: apps/mobile
        run: bun run tauri android build --apk --target aarch64

      # The signed output is app-universal-release.apk; without a signing config Gradle
      # names it *-unsigned.apk instead, so a missing file here means it wasn't signed.
      - name: Rename APK and write checksum
        id: apk
        run: |
          VERSION=$(jq -r .version apps/mobile/src-tauri/tauri.conf.json)
          NAME="workbench-android-${VERSION}.apk"
          mkdir -p dist-android
          cp apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "dist-android/$NAME"
          (cd dist-android && sha256sum "$NAME" > "$NAME.sha256" && cat "$NAME.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [changelog, build, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist-android

      - name: Attach Android APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} dist-android/* --clobber --repo ${{ github.repository }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false --repo ${{ github.repository }}
